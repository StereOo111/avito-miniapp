<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Avito Parser PRO</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <span class="icon">⚡</span>
        <div>
          <h1>Avito Parser PRO</h1>
          <span class="subtitle">Мониторинг объявлений</span>
        </div>
      </div>
      <div id="sub-badge" class="badge badge-active">⏳ Загрузка...</div>
    </header>

    <div id="pc-api-setup-bar" class="user-id-bar">
      <span>🔌 Сервер: <strong id="pc-api-status-label" style="color:var(--success-color)">🟢 Активно</strong></span>
    </div>

    <div id="user-id-bar" class="user-id-bar">
      <span>🆔 Профиль: <strong id="user-id-display">Загрузка...</strong></span>
    </div>

    <!-- Основная секция ссылок -->
    <section id="tab-links" class="tab-content active" style="margin-top:12px;">
      <div class="card">
        <h2>🎯 Управление ссылками Avito</h2>
        <div class="add-url-group">
          <input type="text" id="new-url-input" placeholder="Вставьте ссылку на поиск Авито...">
          <button type="button" onclick="addLinkUrl()">➕ Добавить</button>
        </div>
        <div id="urls-list-container" class="urls-list-container">
          <!-- Динамический список ссылок -->
        </div>
        <textarea id="urls-input" style="display:none;"></textarea>
      </div>
    </section>

    <div class="action-bar">
      <button id="save-btn" class="btn btn-success flex-1" onclick="saveSettings()">💾 Сохранить настройки</button>
    </div>

    <!-- Модальное окно персональных фильтров для отдельной ссылки -->
    <div id="link-filter-modal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(15,23,42,0.9); backdrop-filter:blur(8px); z-index:9999; align-items:center; justify-content:center; padding:16px;">
      <div style="background:#1E293B; border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:20px; max-width:420px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <h3 style="font-size:16px; font-weight:700; color:#F8FAFC;">⚙️ Параметры ссылки</h3>
          <button type="button" onclick="closeLinkFilterModal()" style="background:transparent; border:none; color:#94A3B8; font-size:22px; cursor:pointer;">×</button>
        </div>
        <p id="link-filter-modal-url" style="font-size:11px; color:#60A5FA; word-break:break-all; margin-bottom:14px; background:#0F172A; padding:8px; border-radius:6px; max-height:50px; overflow-y:auto;"></p>
        
        <div style="display:flex; flex-direction:column; gap:12px;">
          <div>
            <label style="font-size:12px; color:#94A3B8; font-weight:600;">💰 Диапазон цен (₽):</label>
            <div style="display:flex; gap:8px; margin-top:4px;">
              <input type="number" id="modal-link-min-price" placeholder="Мин ₽" style="padding:6px 10px; font-size:13px; flex:1;">
              <input type="number" id="modal-link-max-price" placeholder="Макс ₽" style="padding:6px 10px; font-size:13px; flex:1;">
            </div>
          </div>

          <div>
            <label style="font-size:12px; color:#94A3B8; font-weight:600;">📄 Глубина сбора (страниц):</label>
            <input type="number" id="modal-link-count" value="1" min="1" max="10" style="padding:6px 10px; font-size:13px; margin-top:4px;">
          </div>

          <div>
            <label style="font-size:12px; color:#94A3B8; font-weight:600;">📍 Города / населенные пункты:</label>
            <div class="city-autocomplete-wrapper" style="position:relative; margin-top:4px;">
              <input type="text" id="modal-link-city-search-input" placeholder="Введите город (напр., Москва)..." autocomplete="off" oninput="onModalCitySearchInput(this.value)" style="padding:6px 10px; font-size:13px;">
              <div id="modal-link-city-suggestions-dropdown" class="city-dropdown" style="display:none; position:absolute; z-index:100; width:100%;"></div>
            </div>
            <div id="modal-link-selected-cities-tags" class="selected-cities-tags" style="margin-top:6px;"></div>
          </div>

          <div>
            <label style="font-size:12px; color:#94A3B8; font-weight:600;">⏱️ Макс. возраст объявления:</label>
            <div style="display:flex; gap:8px; margin-top:4px;">
              <input type="number" id="modal-link-max-age" placeholder="0 (без огр.)" style="padding:6px 10px; font-size:13px; flex:1;">
              <select id="modal-link-max-age-unit" style="padding:6px 10px; font-size:13px; flex:1;">
                <option value="minutes">Минуты</option>
                <option value="hours">Часы</option>
                <option value="days">Дни</option>
              </select>
            </div>
          </div>

          <div>
            <label style="font-size:12px; color:#94A3B8; font-weight:600;">⚪ Белый список слов (через запятую):</label>
            <input type="text" id="modal-link-white-words" placeholder="i5, ryzen, pro..." style="padding:6px 10px; font-size:13px; margin-top:4px;">
          </div>

          <div>
            <label style="font-size:12px; color:#94A3B8; font-weight:600;">⚫ Черный список минус-слов (через запятую):</label>
            <input type="text" id="modal-link-black-words" placeholder="запчасти, сломан, ремонт..." style="padding:6px 10px; font-size:13px; margin-top:4px;">
          </div>

          <div>
            <label style="font-size:12px; color:#94A3B8; font-weight:600;">📦 Статус доставки / резерва:</label>
            <select id="modal-link-reserv-mode" style="padding:6px 10px; font-size:13px; margin-top:4px;">
              <option value="all">🌐 Все объявления</option>
              <option value="ignore">📦 Скрыть резервированные</option>
              <option value="only">🚚 Только с доставкой</option>
            </select>
          </div>

          <div style="display:flex; gap:12px; margin-top:4px;">
            <label style="font-size:12px; color:#F8FAFC; display:flex; align-items:center; gap:6px; cursor:pointer;">
              <input type="checkbox" id="modal-link-only-discount"> 🏷️ Со скидкой
            </label>
            <label style="font-size:12px; color:#F8FAFC; display:flex; align-items:center; gap:6px; cursor:pointer;">
              <input type="checkbox" id="modal-link-only-photo"> 📷 Только с фото
            </label>
          </div>

          <div style="display:flex; gap:8px; margin-top:10px;">
            <button type="button" onclick="saveLinkFilterModal()" style="flex:1; background:#3B82F6; color:white; border:none; padding:10px; border-radius:8px; font-weight:600; font-size:13px; cursor:pointer;">💾 Применить к ссылке</button>
            <button type="button" onclick="resetLinkFilterModal()" style="background:#334155; color:#F8FAFC; border:none; padding:10px 14px; border-radius:8px; font-size:12px; cursor:pointer;">🔄 Сбросить</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Модальное окно проверки версии и туннеля -->
    <div id="outdated-modal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(15,23,42,0.9); backdrop-filter:blur(8px); z-index:9999; align-items:center; justify-content:center; padding:16px;">
      <div style="background:#1E293B; border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:24px; max-width:340px; width:100%; text-align:center; box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">
        <div style="font-size:44px; margin-bottom:12px;">🔄</div>
        <h2 style="font-size:18px; margin-bottom:8px; color:#F8FAFC;">Сессия сервера обновилась</h2>
        <p style="font-size:13px; color:#94A3B8; margin-bottom:16px; line-height:1.5;">Ссылка туннеля или версия сервера изменились.<br>Перезапустите Mini App из Telegram меню!</p>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <button type="button" onclick="reconnectApp()" style="background:#3B82F6; color:white; border:none; padding:10px 16px; border-radius:8px; font-weight:600; font-size:13px; cursor:pointer;">🔄 Переподключиться</button>
          <button type="button" onclick="closeApp()" style="background:transparent; color:#94A3B8; border:1px solid #475569; padding:8px 16px; border-radius:8px; font-size:12px; cursor:pointer;">❌ Закрыть</button>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js?v=13"></script>
</body>
</html>
