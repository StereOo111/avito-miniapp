<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Avito Parser PRO</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <span class="icon">⚡</span>
        <div>
          <h1>Avito Parser PRO</h1>
          <span class="subtitle">Мониторинг объявлений</span>
        </div>
      </div>
      <div id="sub-badge" class="badge badge-active">⏳ Загрузка...</div>
    </header>

    <div id="conn-status" class="conn-badge conn-offline">⏳ Проверка...</div>

    <div id="user-id-bar" class="user-id-bar" onclick="promptChangeUserId()" title="Нажмите для смены профиля Telegram ID">
      <span>🆔 Профиль: <strong id="user-id-display">Загрузка...</strong></span>
      <span class="edit-icon">✏️ Сменить</span>
    </div>

    <nav class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('links', this)">🎯 Ссылки</button>
      <button class="tab-btn" onclick="switchTab('filters', this)">🔍 Фильтры</button>
      <button class="tab-btn" onclick="switchTab('leads', this)">📊 Заявки</button>
      <button class="tab-btn" onclick="switchTab('sub', this)">💳 Подписка</button>
    </nav>

    <!-- Ссылки -->
    <section id="tab-links" class="tab-content active">
      <div class="card">
        <h2>🎯 Ссылки Avito</h2>
        <label>Ссылки поиска (по одной в строке):</label>
        <textarea id="urls-input" placeholder="https://www.avito.ru/moskva/telefony..."></textarea>
      </div>
      <div class="card">
        <h2>💰 Цена</h2>
        <div class="grid-2">
          <div><label>Мин ₽:</label><input type="number" id="min-price" placeholder="0"></div>
          <div><label>Макс ₽:</label><input type="number" id="max-price" placeholder="100000"></div>
        </div>
      </div>
      <div class="card">
        <h2>📄 Глубина</h2>
        <label>Страниц на ссылку:</label>
        <input type="number" id="count-page" value="1" min="1" max="10">
      </div>
    </section>

    <!-- Фильтры -->
    <section id="tab-filters" class="tab-content">
      <div class="card">
        <h2>⏰ Возраст объявления</h2>
        <div class="grid-2">
          <div><label>Макс. возраст:</label><input type="number" id="max-age" placeholder="0"></div>
          <div><label>Единицы:</label>
            <select id="max-age-unit">
              <option value="minutes">Минуты</option>
              <option value="hours">Часы</option>
              <option value="days">Дни</option>
            </select>
          </div>
        </div>
      </div>
      <div class="card">
        <h2>📦 Резерв</h2>
        <select id="reserv-mode">
          <option value="ignore">🚫 Скрыть зарезервированные</option>
          <option value="only">📌 Только зарезервированные</option>
          <option value="all">🌐 Все</option>
        </select>
      </div>
      <div class="card">
        <h2>🎯 Опции</h2>
        <div class="switch-row">
          <span>📉 Только со скидкой</span>
          <label class="switch"><input type="checkbox" id="only-discount"><span class="slider"></span></label>
        </div>
        <div class="switch-row">
          <span>📸 Только с фото</span>
          <label class="switch"><input type="checkbox" id="only-photo"><span class="slider"></span></label>
        </div>
      </div>
      <div class="card">
        <h2>🔍 Ключевые слова</h2>
        <label>Белый список:</label>
        <textarea id="white-list" placeholder="iphone, macbook..."></textarea>
        <label style="margin-top:8px">Чёрный список:</label>
        <textarea id="black-list" placeholder="чехол, стекло..."></textarea>
      </div>
    </section>

    <!-- Заявки -->
    <section id="tab-leads" class="tab-content">
      <div class="card">
        <div class="header-between">
          <h2>📊 Лиды</h2>
          <button class="btn btn-secondary btn-sm" onclick="loadLeads()">🔄</button>
        </div>
        <div id="leads-container" class="leads-list">
          <div class="empty-state">Нажмите 🔄 для загрузки</div>
        </div>
      </div>
    </section>

    <!-- Подписка -->
    <section id="tab-sub" class="tab-content">
      <div class="card text-center">
        <div class="sub-status-box">
          <div id="sub-icon" class="status-big">📱</div>
          <h3 id="sub-title">Загрузка...</h3>
          <p id="sub-desc"></p>
        </div>
      </div>
      <div class="card">
        <h2>🎁 Промокод</h2>
        <div class="flex-row">
          <input type="text" id="promo-input" placeholder="Введите код">
          <button class="btn btn-primary" onclick="redeemPromo()">Активировать</button>
        </div>
        <div id="promo-result" class="result-msg"></div>
      </div>
    </section>

    <div class="action-bar">
      <button id="save-btn" class="btn btn-success flex-1" onclick="saveSettings()">💾 Сохранить настройки</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
